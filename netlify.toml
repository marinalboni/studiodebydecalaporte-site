[build]
  command = "npm run build"
  publish = "dist"

# Long-cache hashed build assets — safe because every filename changes when
# its content changes.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # style-src needs 'unsafe-inline' because Astro inlines small component
    # stylesheets by default (build.inlineStylesheets: "auto") — this is
    # intentional, it's what keeps CSS render-blocking requests near zero.
    # frame-src allows the Google Maps embed; form-action covers both the
    # default Netlify Forms submission (same-origin) and Formspree, so
    # switching `form.provider` in site.ts never requires touching this file.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# No www → apex redirect here on purpose: it's configured per site in the
# Netlify UI (Domain management → set the apex as the primary domain, and
# Netlify 301s www to it automatically). Keeps this file domain-free.
